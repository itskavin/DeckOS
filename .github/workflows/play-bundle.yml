name: Play bundle (build only)

# Manual, signed artifact preparation. Never creates a Play app or uploads to Play.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unused Play version code, greater than every previous upload'
        required: true
        type: string
      version_name:
        description: 'Public version name (for example 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Validate inputs and restore private upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re
          code = os.environ['VERSION_CODE']
          if not code.isdigit() or not 1 <= int(code) <= 2100000000:
              raise SystemExit('Invalid version code')
          if not re.fullmatch(r'\d+\.\d+\.\d+', os.environ['VERSION_NAME']):
              raise SystemExit('Invalid version name')
          names = ['KEYSTORE_B64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('All four upload-signing secrets are required; debug fallback is forbidden')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'deckos-upload.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY
      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build upload-signed AAB
        working-directory: app
        run: |
          flutter build appbundle --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" --split-debug-info=build/private-dart-symbols
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: DeckOS-${{ inputs.version_name }}-${{ inputs.version_code }}-upload-signed-candidate
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/bundle/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: private-dart-symbols-${{ inputs.version_code }}
          path: app/build/private-dart-symbols
          if-no-files-found: error
          retention-days: 14
      - name: Remove private upload key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/deckos-upload.jks"
