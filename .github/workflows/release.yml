name: Release

# Disparo MANUAL (Actions -> Release -> Run workflow). O semantic-release decide a
# versão a partir dos commits (feat -> minor, fix -> patch, BREAKING -> major),
# gera o CHANGELOG, cria a tag + a Release e anexa o servidor (Windows, macOS, Linux)
# e o app (.apk). O build do iPhone sai sem assinatura, só como artefato do workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # O instalador (Velopack) precisa saber a versao ANTES de empacotar, mas quem decide a
  # versao e o semantic-release, la no fim. O dry-run calcula a mesma versao sem publicar.
  version:
    name: Próxima versão
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm install

      - id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run | tee dry-run.log
          version=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' dry-run.log || true)
          echo "Próxima versão: ${version:-nenhuma}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # O configurador web (o mesmo app Flutter, build web) sai uma vez só e vai como wwwroot
  # ao lado do executável em todos os sistemas.
  web:
    name: Configurador web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build do configurador web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: app/build/web

  backend:
    name: Backend (Windows .exe)
    needs: [version, web]
    runs-on: windows-latest
    env:
      # Sem commit que gere release, empacota com uma versao qualquer: nada e publicado.
      VERSION: ${{ needs.version.outputs.version || '0.0.0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Testes (uma release nunca sai com teste quebrado)
        run: dotnet test DeckOS.sln -c Release --filter "Category!=RequiresDesktop"

      - name: Publish self-contained (win-x64)
        run: dotnet publish DeckOS/DeckOS.csproj -c Release -f net8.0-windows10.0.17763.0 -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.VERSION }} -o publish

      - name: Embute o web no publish (wwwroot ao lado do exe)
        uses: actions/download-artifact@v8
        with:
          name: web
          path: publish/wwwroot

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath DeckOS-win-x64.zip -Force

      # Instalador com atualizacao automatica. O app procura releases.win.json e o .nupkg
      # na ultima Release do GitHub, entao os dois vao anexados junto com o Setup.
      - name: Instalador (Velopack)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId DeckOSPC --packVersion $env:VERSION --packDir publish `
            --mainExe DeckOS.exe --packTitle DeckOS --packAuthors "Gabriel Freitas" `
            --icon DeckOS/deckos.ico --outputDir velopack
          Move-Item velopack/DeckOSPC-win-Setup.exe velopack/DeckOS-Setup.exe
          Remove-Item velopack/DeckOSPC-win-Portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: backend
          path: |
            DeckOS-win-x64.zip
            velopack/

  # macOS e Linux: só o servidor (net8.0, sem bandeja). O macOS publica no runner de Mac
  # porque o executável precisa da assinatura ad-hoc, que só o SDK no macOS faz (sem ela
  # o Apple Silicon mata o processo na hora).
  backend-unix:
    name: Backend (${{ matrix.rid }})
    needs: [version, web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: osx-arm64, os: macos-latest, app: macos-arm64 }
          - { rid: osx-x64, os: macos-latest, app: macos-x64 }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04 }
    env:
      VERSION: ${{ needs.version.outputs.version || '0.0.0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained (${{ matrix.rid }})
        run: dotnet publish DeckOS/DeckOS.csproj -c Release -f net8.0 -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.VERSION }} -o publish

      - name: Embute o web no publish (wwwroot ao lado do executável)
        uses: actions/download-artifact@v8
        with:
          name: web
          path: publish/wwwroot

      # Os scripts de instalação (serviço launchd/systemd) vão junto, se existirem.
      - name: Scripts de instalação
        run: |
          shopt -s nullglob
          for f in scripts/install-*.sh; do cp "$f" publish/; chmod +x "publish/$(basename "$f")"; done
          chmod +x publish/DeckOS

      # tar.gz guarda o bit de execução (o .zip do Windows não).
      - name: tar.gz
        run: tar -czf DeckOS-${{ matrix.rid }}.tar.gz -C publish .

      # DeckOS.app: o mesmo servidor num bundle que abre com dois cliques e fica sem
      # ícone no Dock (LSUIElement). O servidor vai em Resources/server (wwwroot ao lado do
      # executável, como no Windows) e um lançador em MacOS/ só o chama. Sem assinatura da
      # Apple: na primeira vez, Ajustes -> Privacidade e Segurança -> Abrir Mesmo Assim.
      - name: DeckOS.app (macOS)
        if: matrix.app != ''
        run: |
          app=DeckOS.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/server"
          cp -R publish/. "$app/Contents/Resources/server/"
          cat > "$app/Contents/MacOS/DeckOS" <<'EOF'
          #!/bin/sh
          dir="$(cd "$(dirname "$0")/../Resources/server" && pwd)"
          cd "$dir" && exec ./DeckOS "$@"
          EOF
          chmod +x "$app/Contents/MacOS/DeckOS"
          iconset=$(mktemp -d)/DeckOS.iconset
          mkdir -p "$iconset"
          # Ícone no padrão do macOS (arte em 824 de 1024 px), gerado por branding/generate.py.
          icon=app/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$icon" --out "$iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s*2)) $((s*2)) "$icon" --out "$iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/DeckOS.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DeckOS</string>
            <key>CFBundleDisplayName</key><string>DeckOS</string>
            <key>CFBundleIdentifier</key><string>io.github.itskavin.deckos.server</string>
            <key>CFBundleExecutable</key><string>DeckOS</string>
            <key>CFBundleIconFile</key><string>DeckOS</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>LSUIElement</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>DeckOS talks to the DeckOS app on your phone over your local network.</string>
            <key>NSBonjourServices</key><array><string>_deckos._tcp</string></array>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          ditto -c -k --keepParent "$app" DeckOS-${{ matrix.app }}.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.rid }}
          path: |
            DeckOS-${{ matrix.rid }}.tar.gz
            DeckOS-*.app.zip
          if-no-files-found: error

  app:
    name: App (Android APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # O lint do AGP usa APIs do Java 21; o bytecode do app continua Java 17.
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaura assinatura de release (se os secrets existirem)
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
            echo "Assinatura: chave de release"
          else
            echo "Assinatura: debug (sem secrets)"
          fi

      - name: Build do APK
        working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renomeia o APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk DeckOS.apk

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: DeckOS.apk

  # iPhone sem assinatura: prova que o projeto compila e deixa um .ipa para reassinar
  # (AltStore/Sideloadly). Assinar e mandar para a App Store/TestFlight precisa dos
  # certificados da Apple; é um passo à parte. Não vai anexado na Release.
  ios:
    name: App (iOS, sem assinatura)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version || '0.0.0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build do iOS
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}

      - name: .ipa sem assinatura
        run: |
          mkdir -p Payload
          cp -R app/build/ios/iphoneos/Runner.app Payload/
          zip -qry DeckOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: DeckOS-unsigned.ipa

  release:
    name: semantic-release
    needs: [version, backend, backend-unix, app, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # semantic-release precisa do histórico + tags

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Instala o semantic-release
        run: npm install

      - uses: actions/download-artifact@v8
        with:
          name: backend
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: app
          path: dist

      - name: semantic-release (decide versão, cria tag/release, anexa binários)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Passo a passo de instalação no topo da release
        if: needs.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          cat .github/release-header.md notes.md > body.md
          gh release edit "$TAG" --notes-file body.md
